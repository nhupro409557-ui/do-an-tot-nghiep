# Cấu hình dự án và kiểm thử được lưu bằng UTF-8 không BOM.
[project]
name = "electronics-commerce-api"
version = "0.1.0"
description = "FastAPI backend for electronics ecommerce platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.0.0",
    "pyotp>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "google-genai>=2.0.0",
    "boto3>=1.34.0",
    "python-multipart>=0.0.9",
    "langgraph>=1.0.0",
    "reportlab>=4.2.0",
    "python-docx>=1.1.0",
    "cocoindex>=1.0.15",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "contract: kiểm tra contract OpenAPI và bảo vệ truy cập",
    "integration: kiểm tra tích hợp với database PostgreSQL cô lập",
    "workflow: kiểm tra một luồng nghiệp vụ hoàn chỉnh",
]
